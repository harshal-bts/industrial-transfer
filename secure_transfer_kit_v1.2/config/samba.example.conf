# Dedicated lab server only; merge with approved site configuration.
# This is NOT a complete ACL or production security configuration.
[global]
    server min protocol = SMB3_11
    server signing = mandatory
    map to guest = Never
[IndustrialIncoming]
    path = /srv/industrial/incoming
    read only = no
    guest ok = no
    valid users = @industrialtransfer
    smb encrypt = required
[IndustrialReceipts]
    path = /srv/industrial/receipts
    read only = yes
    guest ok = no
    valid users = @industrialtransfer
    smb encrypt = required
